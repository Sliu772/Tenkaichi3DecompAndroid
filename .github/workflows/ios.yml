
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - ios-prototype
    paths:
      - ".github/workflows/ios.yml"

jobs:
  build-sdl3:
    runs-on: macos-14

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout SDL3
        run: git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git SDL3

      - name: Check Xcode target
        run: xcodebuild -list -project SDL3/Xcode/SDL/SDL.xcodeproj

      - name: Build SDL3 xcframework
        run: |
          xcodebuild \
            -project SDL3/Xcode/SDL/SDL.xcodeproj \
            -target SDL3.xcframework \
            -configuration Release

      - name: Verify framework
        run: |
          find SDL3/Xcode/SDL -name "SDL3.xcframework" -type d -print
          test -d SDL3/Xcode/SDL/build/SDL3.xcframework || find SDL3/Xcode/SDL -name "SDL3.xcframework" -type d

      - name: Upload SDL3 xcframework
        uses: actions/upload-artifact@v4
        with:
          name: SDL3-xcframework-ios
          path: SDL3/Xcode/SDL/build/SDL3.xcframework
          if-no-files-found: warn
