name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ios-prototype]
    paths:
      - ".github/workflows/ios.yml"
      - "port/tools/**"
      - "port/ios/**"
      - "port/src/**"
      - "src/**"
      - "include/**"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds. Does the soft-float ABI work for the Darwin triple, and how are variadic arguments passed? (ios_abi_check.sh)
  abi-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 21 for macOS
        run: sh port/tools/ios_toolchain.sh
      - name: ABI check
        run: sh port/tools/ios_abi_check.sh 2>&1 | tee abi-check.log
      - name: Show the result on the summary page
        if: always()
        run: |
          { echo '### ABI check'; echo '```'; cat abi-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: abi-check, path: abi-check.log }

  build-sdl3:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Checkout SDL3
        run: git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git SDL3
      - name: Build SDL3 xcframework
        run: |
          xcodebuild -project SDL3/Xcode/SDL/SDL.xcodeproj -target SDL3.xcframework -configuration Release
      - name: Verify framework
        run: find SDL3/Xcode/SDL -name "SDL3.xcframework" -type d -print
      - uses: actions/upload-artifact@v4
        with:
          name: SDL3-xcframework-ios
          path: SDL3/Xcode/SDL/build/SDL3.xcframework
          if-no-files-found: warn

  # Step 1: do the engine's 332+ sources compile for iOS arm64 (the same pipeline as Android: ptr32, irfix, llc)?
  engine-compile:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 21 for macOS
        run: sh port/tools/ios_toolchain.sh
      - name: Shader compiler
        run: brew install shaderc
      - name: SDL3 headers
        run: git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git SDL3
      - name: Compile the engine
        run: |
          set -o pipefail
          export BT3_PLATFORM=ios
          export BT3_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export BT3_SDL3="$PWD/SDL3"
          export BT3_SKELETON=1
          export BT3_JOBS="$(sysctl -n hw.ncpu)"
          export BT3_KEEP=1   # keep the .ll files (raw clang IR and the final one) for the IR diagnostics below
          python3 port/tools/android.py compile 2>&1 | tee compile.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### Engine compile (iOS arm64)'
            grep -E '^compiled:' compile.log || echo 'did not finish'
            echo; echo 'Errors grouped by message (count, message):'; echo '```'
            grep -E '^FAILED' compile.log | sed -E 's/^FAILED [^ ]+ //; s#/[^ ]*/(Xcode[^ ]*|work/[^ ]*)/##; s/ \(line [0-9]+\)//; s/:[0-9]+:[0-9]+//g; s/^[A-Za-z0-9_.-]+\.(c|h|cpp|s):[0-9]+:/FILE:/' | cut -c1-200 | sort | uniq -c | sort -rn | head -40
            echo '```'; echo; echo 'Files that failed:'; echo '```'
            grep -E '^FAILED' compile.log | awk '{print $2}' | sort -u | head -150 | tr '\n' ' '
            echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: engine-compile-log, path: compile.log }
      - uses: actions/upload-artifact@v4
        with:
          name: engine-objs
          retention-days: 1
          path: |
            port/build/ios/obj
            port/build/ios/obj_data
            !port/build/ios/obj/*.ll
            !port/build/ios/obj/*.i
      - name: IR of the memory card callbacks (before and after p32rebase)
        if: always()
        run: |
          mkdir -p ir
          cp port/build/ios/obj/*menu_i_b*.ll port/build/ios/obj/*sys_mcflow_a*.ll ir/ 2>/dev/null || true
          {
            echo "== BootCard_Init, raw clang IR =="
            awk '/^define .*@BootCard_Init\(/ {p=1} p {print} p && /^}/ {exit}' port/build/ios/obj/menu_menu_i_b.raw.ll
            echo; echo "== BootCard_Init, after irfix + p32rebase =="
            awk '/^define .*@BootCard_Init\(/ {p=1} p {print} p && /^}/ {exit}' port/build/ios/obj/menu_menu_i_b.ll
            for v in raw final; do
              f=port/build/ios/obj/sys_mcflow_a.ll; [ $v = raw ] && f=port/build/ios/obj/sys_mcflow_a.raw.ll
              echo; echo "== McFlow_SetDoneCb (the callee), $v IR =="
              awk '/^define .*@McFlow_SetDoneCb\(/ {p=1} p {print} p && /^}/ {exit}' "$f"
              echo; echo "== McFlow_Update, $v IR (first 40 lines) =="
              awk '/^define .*@McFlow_Update\(/ {p=1} p {print} p && /^}/ {exit}' "$f" | head -40
            done
            echo; echo "== declaration of McFlow_SetDoneCb =="
            grep -hE '(declare|define) .*@McFlow_SetDoneCb' port/build/ios/obj/menu_menu_i_b.raw.ll
          } > ir/bootcard_ir.txt 2>&1 || true
          # every function address that is still an absolute address in the final IR (what BootCard_Init suffered from)
          { grep -HnE 'ptrtoint \(ptr @[A-Za-z_][A-Za-z0-9_.$]* to i(32|64)\)' port/build/ios/obj/*.ll \
              | grep -v '\.raw\.ll' | grep -v '_mh_execute_header' | grep -v 'sub (i64\|i64 sub' ; } > ir/suspect_absolute_addresses.txt 2>&1 || true
          # an ordinary pointer truncated to 32 bits without the header subtracted (the symptom of the crash)
          { grep -HnE 'ptrtoint ptr [%@][^ ]+ to i32' port/build/ios/obj/*.ll | grep -v '\.raw\.ll' ; } > ir/suspect_trunc_to_i32.txt 2>&1 || true
          { grep -HnE 'addrspacecast \(ptr @' port/build/ios/obj/*.ll | grep -v '\.raw\.ll' ; } > ir/leftover_addrspacecast.txt 2>&1 || true
          wc -l ir/*.txt
          { echo '### IR diagnostics'; echo '```'; head -80 ir/bootcard_ir.txt; echo '```'
            echo; echo "Suspect absolute addresses: $(wc -l < ir/suspect_absolute_addresses.txt)"
            echo "Suspect 32-bit truncations: $(wc -l < ir/suspect_trunc_to_i32.txt)"
            echo "Leftover addrspacecast of a symbol: $(wc -l < ir/leftover_addrspacecast.txt)"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bt3-ir, path: ir, if-no-files-found: ignore }
      - name: Collect the IR of the files that failed
        if: always()
        run: |
          mkdir -p failed-ll
          for n in $(grep -E '^FAILED' compile.log | awk '{print $2}' | sort -u); do
            cp port/build/ios/obj/*_"${n%.c}".ll failed-ll/ 2>/dev/null || true
          done
          grep -nE 'LLVM ERROR|Cannot select|unsupported' compile.log | head -20 || true
          ls -la failed-ll
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: failed-ll, path: failed-ll, if-no-files-found: ignore }

  # Step 2: link the objects into the Mach-O executable and package an unsigned .ipa (Sideloadly / SideStore sign it).
  # The first run on a device only has to leave bt3_log.txt in the app's Documents folder (Files app > On My iPhone > BT3).
  link-ipa:
    needs: [build-sdl3, engine-compile]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: SDL3-xcframework-ios, path: SDL3.xcframework }
      - uses: actions/download-artifact@v4
        with: { name: engine-objs, path: port/build/ios }
      - name: MoltenVK (Vulkan on Metal; the renderer's SPIR-V shaders need SDL_GPU's Vulkan driver)
        run: |
          curl -fsSL -o mvk.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          mkdir mvk && tar -xf mvk.tar -C mvk MoltenVK/MoltenVK/dynamic
          echo "BT3_MOLTENVK=$PWD/mvk/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework" >> "$GITHUB_ENV"
      - name: Link
        run: |
          set -o pipefail
          export BT3_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export BT3_SDL3_XCF="$PWD/SDL3.xcframework"
          find "$BT3_SDL3_XCF" -maxdepth 2 | head -20
          python3 port/tools/ios_link.py 2>&1 | tee link.log
      - name: Package
        run: sh port/tools/ios_package.sh "$PWD/SDL3.xcframework"
      - name: What is inside the .ipa
        run: unzip -l port/build/ios/bt3.ipa | tail -n +4 | awk '{print $1, $4}' | grep -E "Frameworks/[^/]+/[^/]+$|bt3(\.dat)?$|Info.plist" | head -20
      - name: Disassemble the heap functions
        if: always()
        run: |
          xcrun otool -tV port/build/ios/bt3 > full_disasm.txt || true
          { echo "== Heap_Create =="; grep -A70 "^_Heap_Create:" full_disasm.txt;
            echo; echo "== Heap_AllocBlock =="; grep -A160 "^_Heap_AllocBlock:" full_disasm.txt;
            echo; echo "== Port_Malloc =="; grep -A40 "^_Port_Malloc:" full_disasm.txt; } > heap_disasm.txt || true
          wc -l heap_disasm.txt
      - name: Disassemble the memory card callback path
        if: always()
        run: |
          { for f in BootCard_Init BootCard_OnFlowDone McFlow_SetDoneCb McFlow_CallDone McFlow_UpdateBootLoad McFlow_Update; do
              echo "== $f =="
              awk -v s="^_${f}:" '$0 ~ s {p=1; print; next} p && /^_[A-Za-z0-9_.$]+:/ {p=0} p' full_disasm.txt
              echo
            done; } > callback_disasm.txt || true
          wc -l callback_disasm.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '### iOS link'; echo '```'; head -60 link.log || true; echo '```'
            echo; echo 'Symbols still stubbed (what is left to port):'; echo '```'
            wc -l < port/build/ios/stubs.txt || true; head -150 port/build/ios/stubs.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bt3-ios-link
          path: |
            link.log
            heap_disasm.txt
            callback_disasm.txt
            port/build/ios/stubs.txt
            port/build/ios/bt3.map
      - uses: actions/upload-artifact@v4
        with: { name: bt3-ipa, path: port/build/ios/bt3.ipa }
